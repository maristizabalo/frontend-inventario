<ion-content class="ion-padding">
  <h2>Lista de Productos</h2>

  <ng-container *ngIf="loading; else productsList">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Cargando productos...</p>
  </ng-container>

  <ng-template #productsList>
    <ion-card *ngFor="let product of products">
      <ion-card-header>
        <ion-card-title>{{ product.nombre }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>{{ product.descripcion }}</p>
        <p><strong>Stock:</strong> {{ product.stock }}</p>

        <ion-button size="small" color="success" (click)="promptForQuantity(product.id, 'entrada')">
          Entrada
        </ion-button>
        <ion-button size="small" color="warning" (click)="promptForQuantity(product.id, 'salida')">
          Salida
        </ion-button>
      </ion-card-content>
    </ion-card>

    <ion-refresher slot="fixed" (ionRefresh)="loadProducts($event)">
      <ion-refresher-content></ion-refresher-content>
    </ion-refresher>
  </ng-template>
</ion-content>
